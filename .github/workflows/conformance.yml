name: conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reference:
    name: ${{ matrix.check_name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.11"
            check_name: reference (3.11)
          - python: "3.12"
            check_name: reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install reference tools
        run: pip install -e "./reference[test]"
      - name: Tests
        run: pytest -q reference/tests
      - name: Conformance vectors
        run: agent-clearance-conformance
      - name: Generated fixtures are current
        run: |
          agent-clearance-generate
          git diff --exit-code -- examples conformance/vectors
          test -z "$(git ls-files --others --exclude-standard -- examples conformance/vectors)"
      - name: Public documentation links
        run: python tools/check_public_docs.py

  edge-shadow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/typescript-edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/typescript-edge/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and test
        run: npm test
